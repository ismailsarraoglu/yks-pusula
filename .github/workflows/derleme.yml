name: derleme
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: derleme
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Hazirlik
        run: |
          mkdir -p ci/logs ci/apk ci/screens
          git log -1 --format='%h %s' > ci/logs/commit.txt
      - name: Derle ve birim testleri calistir
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:assembleDebugAndroidTest 2>&1 | tee ci/logs/gradle.txt
      - name: Manifest denetimi
        if: steps.gradle.outcome == 'success'
        id: manifest
        continue-on-error: true
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          $AAPT dump badging $APK | grep -E "^(package|sdkVersion|targetSdkVersion|application-debuggable)" | tee ci/logs/apk-badging.txt
          $AAPT dump permissions $APK | tee ci/logs/apk-permissions.txt
          grep -E 'uses-permission' ci/logs/apk-permissions.txt | sed "s/.*name='//; s/'.*//" | sort > ci/logs/izinler.txt
          ! grep -q application-debuggable ci/logs/apk-badging.txt
          grep -q "targetSdkVersion:'36'" ci/logs/apk-badging.txt
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --verbose $APK | tee ci/logs/apk-signature.txt
          ls -la app/build/outputs/bundle/release/ | tee ci/logs/aab.txt
      - name: APK dosyalarini kopyala
        if: steps.gradle.outcome == 'success'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ci/apk/yks-pusula-debug.apk
          cp app/build/outputs/apk/release/app-release.apk ci/apk/yks-pusula-release.apk
          cp app/build/outputs/bundle/release/app-release.aab ci/apk/yks-pusula-release.aab
          ls -la ci/apk > ci/logs/apk-sizes.txt
      - name: KVM ayarla
        if: steps.gradle.outcome == 'success' && (contains(github.event.head_commit.message, '[emu]') || contains(github.event.head_commit.message, '[tam]') || contains(github.event.head_commit.message, '[reklam]'))
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Disk alani ac
        if: steps.gradle.outcome == 'success' && (contains(github.event.head_commit.message, '[emu]') || contains(github.event.head_commit.message, '[tam]') || contains(github.event.head_commit.message, '[reklam]'))
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup /usr/share/swift /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Python /opt/hostedtoolcache/Ruby /usr/local/share/chromium /usr/local/share/powershell /usr/local/lib/node_modules
          df -h / | tail -1
      - name: Emulator testleri
        id: emu
        if: steps.gradle.outcome == 'success' && (contains(github.event.head_commit.message, '[emu]') || contains(github.event.head_commit.message, '[tam]'))
        continue-on-error: true
        timeout-minutes: 70
        run: bash tools/run-emulator.sh
      - name: Surum uyumlulugu
        if: steps.gradle.outcome == 'success' && contains(github.event.head_commit.message, '[tam]')
        continue-on-error: true
        timeout-minutes: 105
        run: bash tools/matris.sh
      - name: Reklam teshisi
        if: steps.gradle.outcome == 'success' && contains(github.event.head_commit.message, '[reklam]')
        continue-on-error: true
        timeout-minutes: 90
        run: bash tools/reklam-teshis.sh
      - name: Rapor
        if: always()
        run: |
          cp -r app/schemas ci/logs/schemas 2>/dev/null || true
          {
            echo "gradle=${{ steps.gradle.outcome }}"
            echo "manifest=${{ steps.manifest.outcome }}"
            echo "emu=${{ steps.emu.outcome }}"
            echo "run=${{ github.run_id }}"
          } > ci/logs/ozet.txt
          grep -E '^e: |error:|FAILED|What went wrong|\[ksp\]' ci/logs/gradle.txt | head -150 > ci/logs/hatalar.txt || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do [ -f "$f" ] && cp "$f" ci/logs/; done
      - name: Sonuclari ci-results dalina yaz
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ci
          git init -q -b ci-results
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -A
          git commit -qm "derleme $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
