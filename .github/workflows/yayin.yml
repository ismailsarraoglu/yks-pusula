name: yayin-aab
# Elle başlatılır. Play'e yüklenecek AAB'yi kullanıcının kendi yükleme anahtarıyla imzalar.
# Anahtar ve kimlikler GitHub Secrets içinde durur; depoya yazılmaz.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
      UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_NATIVE_ID: ${{ secrets.ADMOB_NATIVE_ID }}
      PLAY_PUBLIC_KEY: ${{ secrets.PLAY_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Gizli degerleri denetle
        run: |
          eksik=0
          for a in UPLOAD_KEYSTORE_B64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD ADMOB_APP_ID ADMOB_NATIVE_ID PLAY_PUBLIC_KEY; do
            if [ -z "${!a}" ]; then echo "::error::Eksik gizli deger: $a"; eksik=1; fi
          done
          exit $eksik
      - name: Anahtari hazirla
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_STORE_PASSWORD=$UPLOAD_STORE_PASSWORD"
            echo "UPLOAD_KEY_ALIAS=$UPLOAD_KEY_ALIAS"
            echo "UPLOAD_KEY_PASSWORD=$UPLOAD_KEY_PASSWORD"
            echo "ADMOB_APP_ID=$ADMOB_APP_ID"
            echo "ADMOB_NATIVE_ID=$ADMOB_NATIVE_ID"
            echo "PLAY_PUBLIC_KEY=$PLAY_PUBLIC_KEY"
          } > keystore.properties
      - name: AAB derle
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:bundleRelease :app:assembleRelease
      - name: Imzayi dogrula
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -2
      - name: Anahtari sil
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: yks-pusula-play-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 3
          if-no-files-found: error
